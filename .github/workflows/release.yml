name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # criar a Release
  packages: write # publicar no GHCR
  id-token: write # login na AWS por OIDC (sem chave guardada no GitHub)

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/morea-ifs/atum
  # Valores falsos só para os testes (a máquina é apagada no fim)
  SECRET_KEY: ci-inseguro
  DEBUG: "False"
  HOST: localhost,127.0.0.1
  ENVIRONMENT: PROD
  DBTYPE: mysql
  DBNAME: atum
  DBUSER: root
  DBPASSWORD: root_ci
  DBHOST: 127.0.0.1
  DBPORT: "3306"

jobs:
  # Mesmos passos do job test do ci.yml: nunca publicar sem testar o commit exato da tag
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: atum
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão a partir da tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"            # v0.1.0-rc1 -> 0.1.0-rc1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;   # tem sufixo: rc, beta...
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e publicação da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # "latest" só para versão final; pre-release não deve virar a imagem padrão
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Criar Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          extra=""
          [ "$PRERELEASE" = "true" ] && extra="--prerelease"
          gh release create "$GITHUB_REF_NAME" --generate-notes $extra \
            --notes "Imagem: \`${IMAGE}:${{ steps.version.outputs.version }}\`"

  # Atualiza a EC2 pelo SSM (sem SSH). Só roda em versão final e quando as variáveis
  # da AWS existem em Settings → Secrets and variables → Actions → Variables.
  deploy:
    needs: publish
    if: needs.publish.outputs.prerelease == 'false' && vars.AWS_DEPLOY_ROLE != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/atum' }}
    steps:
      - name: Credenciais da AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }} # IAM role com ssm:SendCommand e ssm:GetCommandInvocation
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Atualizar a EC2
        run: |
          # O docker-compose da EC2 usa image: ghcr.io/morea-ifs/atum:${ATUM_TAG:-latest}
          cmd="cd $DEPLOY_PATH && export ATUM_TAG=$VERSION && docker compose pull && docker compose up -d"
          id=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy atum $VERSION" \
            --parameters "commands=[\"$cmd\"]" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $id"
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '{status: Status, saida: StandardOutputContent, erro: StandardErrorContent}' --output json
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text)
          [ "$status" = "Success" ] || { echo "::error::Deploy na EC2 terminou com status $status"; exit 1; }

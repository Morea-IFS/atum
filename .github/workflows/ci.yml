name: CI

# Roda a cada push nas branches de trabalho e em todo pull request.
# Não faz deploy (o deploy antigo continua no main-cicd.yml).
on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Valores falsos, só para o CI (a máquina é apagada no fim). Nada de .env baixado.
env:
  SECRET_KEY: ci-inseguro
  DEBUG: "False"
  HOST: localhost,127.0.0.1
  ENVIRONMENT: PROD
  DBTYPE: mysql
  DBNAME: atum
  DBUSER: root # root porque o manage.py test cria e apaga o banco test_atum
  DBPASSWORD: root_ci
  DBHOST: 127.0.0.1
  DBPORT: "3306"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: atum
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.5"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: atum
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # deixa a imagem disponível para o docker run abaixo
          tags: atum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (sobe o contêiner com MySQL e Redis)
        run: |
          docker run -d --name atum --network host \
            -e SECRET_KEY -e DEBUG -e HOST -e ENVIRONMENT \
            -e DBTYPE -e DBNAME -e DBUSER -e DBPASSWORD -e DBHOST -e DBPORT \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            atum:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/admin/login/ && break
            [ "$i" = 30 ] && { echo "::error::O atum não respondeu /admin/login/ em 60 s"; exit 1; }
            sleep 2
          done
          # A lista de eventos consulta o banco: 200 prova que as migrations criaram as tabelas.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)
          [ "$code" = 200 ] || { echo "::error::/ respondeu $code, esperado 200"; exit 1; }
      - name: Logs do contêiner
        if: always()
        run: docker logs atum || true
